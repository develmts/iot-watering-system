version: 1
devices:
  WS Plan Example:
    - platform: switch
      name: Enabled
      initial_value: "off"
      persistent: true
    - platform: text
      name: Start Time
      initial_value: "09:00"
      min: 5
      max: 5
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      persistent: true
    - platform: text
      name: Season Start
      initial_value: "04-01"
      min: 5
      max: 5
      pattern: '^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
      persistent: true
    - platform: text
      name: Season End
      initial_value: "10-31"
      min: 5
      max: 5
      pattern: '^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$'
      persistent: true
    - platform: text
      name: Devices
      initial_value: '["Watering Control a4f9"]'
      min: 2
      max: 255
      persistent: true
    - platform: select
      name: Target Type
      options:
        - duration
        - capacity
      initial_value: duration
      persistent: true
    - platform: number
      name: Target
      initial_value: "600"
      min: 1
      max: 3600
      persistent: true
