- triggers:
    - trigger: state
      entity_id: text.ws_plan_nw_start_time
      to: null
    - trigger: homeassistant
      event: start
    - trigger: time
      at:
        entity_id: sensor.ws_plan_nw_next_run
        offset: "00:00:10"
  sensor:
    - name: "WS Plan NW Next Run"
      unique_id: ws_plan_nw_next_run
      device_class: timestamp
      availability: >
        {{ states('text.ws_plan_nw_start_time')
           | regex_match('^([01][0-9]|2[0-3]):[0-5][0-9]$') }}
      state: >
        {% set scheduled = today_at(
          states('text.ws_plan_nw_start_time')) %}
        {{ (scheduled if scheduled > now()
            else scheduled + timedelta(days=1)).isoformat() }}
